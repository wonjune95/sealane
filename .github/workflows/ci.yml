name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: "1.26"
          go-package: ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: i18n guard (no Korean outside locale files, en/ko keys match)
        run: ../hack/check-i18n.sh

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the dev server
        run: |
          (npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/vite.log; exit 1
      - run: npm run test:ui
        env:
          SEALANE_TEST_URL: http://127.0.0.1:5173
      - if: failure()
        run: cat /tmp/vite.log

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm lint charts/sealane
      - run: helm template sealane charts/sealane -n sealane >/dev/null
      - run: helm template sealane charts/sealane -n sealane --set ingress.enabled=true --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gw' --set sessionSecret.create=false >/dev/null
      - run: helm template sealane charts/sealane -n sealane --set 'accounts.admin=admin:$2a$10$x' --set oidc.enabled=true --set oidc.issuerURL=https://idp --set oidc.clientID=c --set oidc.redirectURL=https://s/cb >/dev/null
      - run: "helm template sealane charts/sealane -n sealane --set podDisruptionBudget.enabled=false --set-string 'tlsCerts.ca\\.crt=-----BEGIN CERTIFICATE-----x' | grep -q 'ca.crt: \"-----BEGIN CERTIFICATE-----x\"'"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t sealane:ci .
