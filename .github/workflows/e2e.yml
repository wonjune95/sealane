name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ISTIO_VERSION: "1.31.1"
  GATEWAY_API_VERSION: "v1.5.1"
  KIND_CLUSTER: sealane-e2e

jobs:
  kind-istio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t sealane:ci .
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
      - name: Install Gateway API CRDs
        run: kubectl apply -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
      - name: Install Istio (minimal profile)
        run: |
          curl -sL https://istio.io/downloadIstio | ISTIO_VERSION="$ISTIO_VERSION" TARGET_ARCH=x86_64 sh -
          "./istio-$ISTIO_VERSION/bin/istioctl" install -y --set profile=minimal
          kubectl -n istio-system rollout status deploy/istiod --timeout=180s
      - name: Load image and install the chart
        run: |
          kind load docker-image sealane:ci --name "$KIND_CLUSTER"
          helm install sealane charts/sealane -n sealane --create-namespace \
            --set image.repository=sealane --set image.tag=ci --set image.pullPolicy=Never
          kubectl -n sealane rollout status deploy/sealane --timeout=180s
      - name: Smoke test
        run: |
          kubectl -n sealane port-forward svc/sealane 8080:8080 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          ./hack/e2e.sh http://localhost:8080 sealane
      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n sealane logs deploy/sealane --tail=100 || true
          cat /tmp/pf.log || true
          kubectl get pods -A
