name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GATEWAY_API_VERSION: "v1.5.1"
  KIND_CLUSTER: sealane-e2e

jobs:
  kind-istio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        istio: ["1.30.5", "1.31.1"]
    env:
      ISTIO_VERSION: ${{ matrix.istio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t sealane:ci .
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
      - name: Install Gateway API CRDs
        run: kubectl apply -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
      - name: Install Istio (minimal profile)
        run: |
          curl -sL https://istio.io/downloadIstio | ISTIO_VERSION="$ISTIO_VERSION" TARGET_ARCH=x86_64 sh -
          "./istio-$ISTIO_VERSION/bin/istioctl" install -y --set profile=minimal
          kubectl -n istio-system rollout status deploy/istiod --timeout=180s
      - name: Load image and install the chart
        run: |
          kind load docker-image sealane:ci --name "$KIND_CLUSTER"
          helm install sealane charts/sealane -n sealane --create-namespace \
            --set image.repository=sealane --set image.tag=ci --set image.pullPolicy=Never --set sessionSecret.create=false
          kubectl -n sealane rollout status deploy/sealane --timeout=180s
      # sessionSecret.create=false is the install.yaml/GitOps shape: the app must generate the key into sealane-secret itself
      - name: Generated session key survives a restart
        run: |
          [ "$(kubectl -n sealane get secret sealane-secret -o jsonpath='{.data.SESSION_SECRET}' | base64 -d | wc -c)" = 64 ]
          kubectl -n sealane port-forward svc/sealane 8080:8080 >/tmp/pf0.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          curl -sf -c /tmp/jar -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' http://localhost:8080/api/login >/dev/null
          kill %1
          kubectl -n sealane rollout restart deploy/sealane
          kubectl -n sealane rollout status deploy/sealane --timeout=180s
          kubectl -n sealane port-forward svc/sealane 8080:8080 >/tmp/pf0.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/jar http://localhost:8080/api/capabilities)
          kill %1
          [ "$code" = 200 ] || { echo "session lost after restart: HTTP $code"; exit 1; }
      - name: Smoke test
        run: |
          kubectl -n sealane port-forward svc/sealane 8080:8080 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          ./hack/e2e.sh http://localhost:8080 sealane
      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n sealane logs deploy/sealane --tail=100 || true
          cat /tmp/pf.log || true
          kubectl get pods -A

  upgrade-from-0-8:
    name: upgrade-from-0.8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t sealane:ci .
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: sealane-upgrade
          node_image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
      - name: Install 0.8.0 from GHCR
        run: |
          kubectl create ns istio-system   # the 0.8.0 chart puts a Role there unconditionally
          helm install sealane oci://ghcr.io/wonjune95/charts/sealane --version 0.8.0 -n sealane --create-namespace --wait --timeout 180s
      - name: Seed accounts on 0.8.0
        run: |
          kubectl -n sealane port-forward svc/sealane 8080:8080 >/tmp/pf1.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          ./hack/upgrade-check.sh pre http://localhost:8080 /tmp/state
          kill %1
      - name: Upgrade to the local chart
        run: |
          kind load docker-image sealane:ci --name sealane-upgrade
          # Since 1.11 the chart renders the accounts ConfigMap; adopt the one the app created (docs/upgrading.md)
          kubectl -n sealane annotate cm sealane-accounts meta.helm.sh/release-name=sealane meta.helm.sh/release-namespace=sealane
          kubectl -n sealane label cm sealane-accounts app.kubernetes.io/managed-by=Helm
          helm upgrade sealane charts/sealane -n sealane --reset-then-reuse-values \
            --set image.repository=sealane --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 180s
          helm history sealane -n sealane
      - name: Verify after upgrade
        run: |
          kubectl -n sealane port-forward svc/sealane 8080:8080 >/tmp/pf2.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          ./hack/upgrade-check.sh post http://localhost:8080 /tmp/state
      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n sealane logs deploy/sealane --tail=100 || true
          kubectl -n sealane get cm,secret,deploy,svc || true
          cat /tmp/pf1.log /tmp/pf2.log 2>/dev/null || true
