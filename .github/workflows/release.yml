# On a v* tag push, publish the container image and the Helm chart to GHCR.
# e.g. git tag v0.8.0 && git push origin v0.8.0 → ghcr.io/<owner>/sealane:0.8.0, :latest
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & push
        run: |
          TAG=${GITHUB_REF_NAME#v}
          IMG=ghcr.io/${{ github.repository_owner }}/sealane
          docker build -t "$IMG:$TAG" -t "$IMG:latest" .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
      - name: Push Helm chart (OCI)
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package charts/sealane --version "$TAG" --app-version "$TAG"
          helm push "sealane-$TAG.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
