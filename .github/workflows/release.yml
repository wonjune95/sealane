# On a v* tag push: build a multi-arch image, sign it (cosign keyless), attach an SBOM,
# publish and sign the Helm chart on GHCR, render install.yaml and create the GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # GitHub Release + assets
  packages: write    # GHCR image + chart
  id-token: write    # cosign keyless signing (Sigstore OIDC)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sealane

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Vulnerability scan (informational)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Package and push the chart
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package charts/sealane --version "$TAG" --app-version "$TAG"
          helm push "sealane-$TAG.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/sealane:$TAG"
      - name: Render install.yaml
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          {
            printf '# Sealane %s — rendered from charts/sealane with default values.\n' "$TAG"
            printf '# kubectl apply -f install.yaml   (installs into namespace "sealane")\n'
            printf '# Expects namespace "istio-system" for the istiod version reader (Helm value istioNamespace); without Istio, the two "namespaces istio-system not found" errors are harmless.\n'
            printf 'apiVersion: v1\nkind: Namespace\nmetadata:\n  name: sealane\n---\n'
            helm template sealane charts/sealane --namespace sealane \
              --set image.tag="$TAG" --set sessionSecret.create=false
          } > install.yaml
          grep -c '^kind:' install.yaml
      - run: test -f docs/releases/v${{ steps.meta.outputs.tag }}.md
      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: docs/releases/v${{ steps.meta.outputs.tag }}.md
          generate_release_notes: true
          files: |
            install.yaml
            sbom.spdx.json
            sealane-${{ steps.meta.outputs.tag }}.tgz
