# Local accounts: one key per user, value "role:bcryptHash" (role: admin | editor | viewer).
# Sealane adds admin/admin here at first start when there is no admin key; the settings page (or kubectl edit)
# changes it afterwards. helm upgrade and kubectl apply leave existing keys alone: the chart renders only
# the keys listed in .Values.accounts (none by default), and helm uninstall keeps the ConfigMap.
#   kubectl -n {{ .Release.Namespace }} edit configmap {{ .Values.accountsConfigMap }}     # add  username: "role:hash"
#   go run ./hack/bcrypt-hash.go 'password'          # or: htpasswd -bnBC 10 "" 'password' | tr -d ':\n'
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.accountsConfigMap }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sealane.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
{{- with .Values.accounts }}
data:
  {{- range $user, $v := . }}
  {{ $user }}: {{ $v | quote }}
  {{- end }}
{{- end }}
