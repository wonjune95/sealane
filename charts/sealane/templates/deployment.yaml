apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sealane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sealane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sealane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sealane.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sealane.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # distroless "nonroot" is a named user; kubelet needs the numeric uid to
        # verify runAsNonRoot at admission time.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sealane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--addr=:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # Local accounts: the accounts ConfigMap is mounted as a directory (one file per user, "role:bcryptHash"). Editing the ConfigMap adds/removes users without a restart.
            - name: ACCOUNTS_DIR
              value: /etc/sealane/accounts
            # ConfigMap the settings page patches when a user changes their password
            - name: ACCOUNTS_CONFIGMAP
              value: {{ .Values.accountsConfigMap | quote }}
            # Multi-cluster: Secret holding remote kubeconfigs (empty = local only)
            - name: CLUSTERS_SECRET
              value: {{ .Values.clustersSecret | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if (default dict .Values.requestTester).enabled }}
            # Request tester (uses pods/exec, admin only)
            - name: REQUEST_TESTER
              value: "true"
            {{- end }}
            - name: ISTIO_NAMESPACE
              value: {{ .Values.istioNamespace | quote }}
            # client-go / libraries may write under $HOME; point it at a writable
            # emptyDir so readOnlyRootFilesystem holds (Gemini review).
            - name: HOME
              value: /home/nonroot
            # Trust roots: the system bundle plus every certificate in the -tls-certs ConfigMap.
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/sealane/tls-certs
            # Change history: <name> lists the last 200 changes made through Sealane, <name>-objects keeps the
            # objects before and after them (size-bounded). Sealane creates both on the first change.
            - name: HISTORY_CONFIGMAP
              value: {{ include "sealane.fullname" . }}-history
            # Without SESSION_SECRET (install.yaml, GitOps) Sealane generates a key once into this Secret, so restarts and replicas share it.
            - name: SESSION_SECRET_NAME
              value: {{ include "sealane.fullname" . }}-secret
            {{- $ss := default dict .Values.sessionSecret }}
            {{- if or $ss.create $ss.existingSecret }}
            # Stable session-signing key (see values.sessionSecret)
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sealane.sessionSecretName" . }}
                  key: session-secret
            {{- end }}
            {{- $oidc := default dict .Values.oidc }}
            {{- if and $oidc.enabled (default dict $oidc.clientSecretRef).name }}
            # Single sign-on client secret (values.oidc.clientSecretRef); the other OIDC_* settings come from the -cm ConfigMap below
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.clientSecretRef.name | quote }}
                  key: {{ $oidc.clientSecretRef.key | default "clientSecret" | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Settings (OIDC_*, LOCAL_LOGIN …) and the client secret, editable without Helm — see the -cm ConfigMap.
          envFrom:
            - configMapRef:
                name: {{ include "sealane.fullname" . }}-cm
                optional: true
            - secretRef:
                name: {{ include "sealane.fullname" . }}-secret
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
            - name: accounts
              mountPath: /etc/sealane/accounts
              readOnly: true
            - name: tls-certs
              mountPath: /etc/sealane/tls-certs
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        # Rendered by the chart without data; Sealane and the settings page fill it in. optional: without it nobody can log in, nothing else breaks.
        - name: accounts
          configMap:
            name: {{ .Values.accountsConfigMap }}
            optional: true
        - name: tls-certs
          configMap:
            name: {{ include "sealane.fullname" . }}-tls-certs
            optional: true
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
