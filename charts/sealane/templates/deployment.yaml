apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sealane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sealane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sealane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sealane.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sealane.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # distroless "nonroot" is a named user; kubelet needs the numeric uid to
        # verify runAsNonRoot at admission time.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sealane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--addr=:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # Local accounts: the accounts ConfigMap is mounted as a directory (one file per user, "role:bcryptHash"). Editing the ConfigMap adds/removes users without a restart.
            - name: ACCOUNTS_DIR
              value: /etc/sealane/accounts
            # ConfigMap the settings page patches when a user changes their password
            - name: ACCOUNTS_CONFIGMAP
              value: {{ .Values.accountsConfigMap | quote }}
            # Multi-cluster: Secret holding remote kubeconfigs (empty = local only)
            - name: CLUSTERS_SECRET
              value: {{ .Values.clustersSecret | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if (default dict .Values.requestTester).enabled }}
            # Request tester (uses pods/exec, admin only)
            - name: REQUEST_TESTER
              value: "true"
            {{- end }}
            - name: ISTIO_NAMESPACE
              value: {{ .Values.istioNamespace | quote }}
            # client-go / libraries may write under $HOME; point it at a writable
            # emptyDir so readOnlyRootFilesystem holds (Gemini review).
            - name: HOME
              value: /home/nonroot
            {{- $ss := default dict .Values.sessionSecret }}
            {{- if or $ss.create $ss.existingSecret }}
            # Stable session-signing key (see values.sessionSecret)
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sealane.sessionSecretName" . }}
                  key: session-secret
            {{- end }}
            {{- $oidc := default dict .Values.oidc }}
            {{- if $oidc.enabled }}
            {{- if or (not $oidc.issuerURL) (not $oidc.clientID) (not (default dict $oidc.clientSecretRef).name) (not $oidc.redirectURL) }}
            {{- fail "oidc.enabled=true requires oidc.issuerURL, oidc.clientID, oidc.clientSecretRef.name and oidc.redirectURL" }}
            {{- end }}
            # Single sign-on (see values.oidc)
            - name: OIDC_ISSUER_URL
              value: {{ $oidc.issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $oidc.clientID | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.clientSecretRef.name | quote }}
                  key: {{ $oidc.clientSecretRef.key | default "clientSecret" | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ $oidc.redirectURL | quote }}
            - name: OIDC_SCOPES
              value: {{ join " " ($oidc.scopes | default (list "openid" "profile" "email" "groups")) | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ $oidc.groupsClaim | default "groups" | quote }}
            - name: OIDC_USERNAME_CLAIM
              value: {{ $oidc.usernameClaim | default "email" | quote }}
            {{- $roles := default dict $oidc.roles }}
            - name: OIDC_ROLES_ADMIN
              value: {{ join "," ($roles.admin | default list) | quote }}
            - name: OIDC_ROLES_EDITOR
              value: {{ join "," ($roles.editor | default list) | quote }}
            - name: OIDC_ROLES_VIEWER
              value: {{ join "," ($roles.viewer | default list) | quote }}
            - name: OIDC_DEFAULT_ROLE
              value: {{ $oidc.defaultRole | default "" | quote }}
            - name: OIDC_DISPLAY_NAME
              value: {{ $oidc.displayName | default "SSO" | quote }}
            {{- if $oidc.hideLocalLogin }}
            - name: LOCAL_LOGIN
              value: hidden
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
            - name: accounts
              mountPath: /etc/sealane/accounts
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        # Not managed by Helm (see examples/accounts-configmap.yaml) so helm upgrade never overwrites accounts. optional: without it nobody can log in, nothing else breaks.
        - name: accounts
          configMap:
            name: {{ .Values.accountsConfigMap }}
            optional: true
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
