{{- if and .Values.sessionSecret.create (not .Values.sessionSecret.existingSecret) }}
{{- $name := include "sealane.sessionSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sealane.labels" . | nindent 4 }}
type: Opaque
data:
  # Generated once; reused on every upgrade so sessions and the OIDC state cookie stay valid.
  session-secret: {{ if and $existing $existing.data }}{{ index $existing.data "session-secret" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
