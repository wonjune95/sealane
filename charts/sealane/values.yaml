image:
  repository: ghcr.io/wonjune95/sealane
  tag: ""              # empty = chart appVersion
  pullPolicy: IfNotPresent

# e.g. [{name: regcred}] for a private registry.
imagePullSecrets: []

# The app is stateless: raise this for HA (2+ = zero-downtime rollouts).
replicaCount: 1

# Namespace where istiod runs — used to show the control-plane version on the home page.
# "" skips the istiod-reader Role (no version shown); a live helm install also skips it when this namespace is absent.
istioNamespace: istio-system

service:
  type: ClusterIP
  port: 8080

# Local accounts ConfigMap. One key = one user, value = "role:bcryptHash" (role: admin|editor|viewer).
# The chart renders it empty (helm.sh/resource-policy: keep); Sealane adds admin/admin at first start and the
# settings page edits it. Upgrades only touch the keys listed under accounts below, uninstall keeps it.
# Upgrading from Istio Dashboard? Set this to istio-dashboard-accounts to keep existing users.
accountsConfigMap: sealane-accounts

# Seed accounts from values (GitOps, no UI). Helm manages exactly these keys: changing or removing one here
# changes or removes it in the cluster on the next upgrade; keys added in the UI are left alone.
# Hash a password:  go run ./hack/bcrypt-hash.go 'password'   (or: htpasswd -bnBC 10 "" 'password' | tr -d ':\n')
accounts: {}
#  admin: "admin:$2a$10$..."
#  viewer1: "viewer:$2a$10$..."

# Multi-cluster: Secret holding remote kubeconfigs (key = cluster name, value = kubeconfig).
# The settings page manages this Secret. Set to istio-dashboard-clusters when upgrading.
clustersSecret: sealane-clusters

# Request tester: runs curl inside a pod you pick to send a real HTTP request.
# Enabling it grants the ServiceAccount pods/exec, which is effectively
# "run any command in any pod" — keep it off unless you need it (admin-only in the UI).
requestTester:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceMonitor:
  enabled: false

# Session cookie signing key. With create=true the chart generates a random key once and
# keeps it across upgrades (helm lookup), so sessions survive restarts and are shared by all
# replicas. Point existingSecret at your own Secret (key: session-secret) to manage it yourself.
# install.yaml is rendered with create=false: the app then uses a random per-boot key.
# GitOps tools (Argo CD, Flux) and plain "helm template" cannot use lookup and would render a new key on every sync — point existingSecret at a Secret you manage instead.
sessionSecret:
  create: true
  existingSecret: ""

# Expose through an Ingress controller.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - sealane.example.com
  tls: []
  #  - secretName: sealane-tls
  #    hosts: [sealane.example.com]

# Expose through a Gateway API Gateway (HTTPRoute).
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: my-gateway
  #    namespace: my-gateway-ns
  hostnames:
    - sealane.example.com

# Single sign-on (OpenID Connect). Local accounts keep working alongside it.
# Any OIDC provider works (Keycloak, Dex, Google, Entra ID …). Groups from the ID token
# are mapped to Sealane roles; users with no matching group get defaultRole ("" = refused).
# These values render into the <release>-cm ConfigMap (OIDC_* keys), which can also be edited directly
# (install.yaml installs); the client secret is read from clientSecretRef, or from Secret <release>-secret key OIDC_CLIENT_SECRET.
oidc:
  enabled: false
  displayName: SSO
  issuerURL: ""                     # e.g. https://keycloak.example.com/realms/main
  clientID: ""
  clientSecretRef:
    name: ""                        # Secret holding the client secret; "" = Secret <release>-secret, key OIDC_CLIENT_SECRET
    key: clientSecret
  redirectURL: ""                   # https://sealane.example.com/api/auth/oidc/callback — must match the IdP client
  scopes: [openid, profile, email, groups]
  groupsClaim: groups
  usernameClaim: email
  roles:
    admin: []                       # e.g. [platform-admins]
    editor: []
    viewer: []
  defaultRole: viewer
  hideLocalLogin: false             # hide the username/password form when SSO is on (the API still accepts local logins; /?local=1 shows the form)

# Passed through to the pod as-is. Example uses: SHUTDOWN_DELAY, HTTPS_PROXY, or a private CA
# for the OIDC issuer (SSL_CERT_FILE + a ConfigMap mount, see docs/authentication.md#private-ca).
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
