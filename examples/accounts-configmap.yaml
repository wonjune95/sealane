# Sealane local accounts.
# - One key = one user, value = "role:bcryptHash" (role: admin | editor | viewer)
# - viewer is read-only; editor/admin can make changes.
# - The chart and install.yaml create this ConfigMap empty and Sealane adds "admin" with a
#   random password in Secret sealane-initial-admin; edit it with kubectl or the settings
#   page. No restart needed: Sealane reads it within seconds, and a deleted, demoted or
#   re-passworded account's sessions end. Helm only rewrites keys set under the
#   `accounts` value.
#
# Hash a password:  go run ./hack/bcrypt-hash.go 'password'
# Add a user:       kubectl -n sealane edit configmap sealane-accounts
apiVersion: v1
kind: ConfigMap
metadata:
  name: sealane-accounts
  namespace: sealane
data:
  admin: "admin:<bcrypt-hash>"
  # viewer1: "viewer:<bcrypt-hash>"
