# Pod-to-pod demo: contrast "where does the config say this goes" (route check) with
# "how does it actually respond" (send) in the request console. Minimal setup.
#
#   curl 파드 ──(사이드카)──> echo 서비스 ──> echo-v1 | echo-v2
#
# Defaults to v1; adding the header x-user: beta routes to v2.
# Clean up: kubectl delete namespace sealane-demo
apiVersion: v1
kind: Namespace
metadata:
  name: sealane-demo
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: sealane-demo
spec:
  selector:
    app: echo
  ports:
    # For Istio to treat this as HTTP the port name must start with http (protocol selection rule).
    - name: http
      port: 8080
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v1
  namespace: sealane-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo, version: v1}
  template:
    metadata:
      labels: {app: echo, version: v1}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=hello from v1", "-listen=:5678"]
          ports: [{containerPort: 5678}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v2
  namespace: sealane-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo, version: v2}
  template:
    metadata:
      labels: {app: echo, version: v2}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=hello from v2", "-listen=:5678"]
          ports: [{containerPort: 5678}]
---
# Client that sends requests - it ships curl, so it can be the source pod in the request console.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: sealane-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: curl}
  template:
    metadata:
      labels: {app: curl}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo
  namespace: sealane-demo
spec:
  host: echo.sealane-demo.svc.cluster.local
  subsets:
    - name: v1
      labels: {version: v1}
    - name: v2
      labels: {version: v2}
---
# In-mesh routing (gateways: mesh) - applies to pod-to-pod traffic, not ingress.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: echo
  namespace: sealane-demo
spec:
  hosts:
    - echo.sealane-demo.svc.cluster.local
  gateways:
    - mesh
  http:
    # Canary: v2 only when this header is present
    - match:
        - headers:
            x-user:
              exact: beta
      route:
        - destination:
            host: echo.sealane-demo.svc.cluster.local
            subset: v2
    # Default route
    - route:
        - destination:
            host: echo.sealane-demo.svc.cluster.local
            subset: v1
