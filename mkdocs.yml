site_name: Sealane
site_description: Routing console for Istio and Gateway API
site_url: https://wonjune95.github.io/sealane/
repo_url: https://github.com/wonjune95/sealane
repo_name: wonjune95/sealane
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  superpowers/**
  requirements.txt
  announcement.md
  announcement.ko.md
theme:
  name: material
  logo: img/favicon.svg
  favicon: img/favicon.svg
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]
  palette:
    - scheme: default
      primary: blue
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: blue
      toggle: { icon: material/weather-sunny, name: Light mode }
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture & security model: architecture.md
      - Authentication: authentication.md
      - Multi-cluster: multi-cluster.md
  - Features: features.md
  - Reference:
      - Configuration: configuration.md
      - Operations: operations.md
      - Versioning & support: versioning.md
      - Compatibility: compatibility.md
      - Security policy: security.md
  - Project:
      - Contributing: contributing.md
      - Governance & adopters: governance.md
      - Releasing: releasing.md
      - Upgrading: upgrading.md
      - FAQ: faq.md
  - Release notes:
      - "1.13.0": releases/v1.13.0.md
      - "1.12.0": releases/v1.12.0.md
      - "1.11.0": releases/v1.11.0.md
      - "1.10.0": releases/v1.10.0.md
      - "1.9.0": releases/v1.9.0.md
      - "1.8.0": releases/v1.8.0.md
      - "1.7.0": releases/v1.7.0.md
      - "1.6.0": releases/v1.6.0.md
      - "1.5.0": releases/v1.5.0.md
      - "1.4.0": releases/v1.4.0.md
      - "1.3.2": releases/v1.3.2.md
      - "1.3.1": releases/v1.3.1.md
      - "1.3.0": releases/v1.3.0.md
      - "1.2.0": releases/v1.2.0.md
      - "1.1.1": releases/v1.1.1.md
      - "1.1.0": releases/v1.1.0.md
